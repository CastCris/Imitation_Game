<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SPO Games - SPA</title>
    <style>
body{
    min-height:100vh;

    background:
    linear-gradient(
        180deg,
        #f8fbff 0%,
        #eef7ff 100%
    );

    color:#111827;

    font-family:
    "Segoe UI",
    sans-serif;
}

nav{
    position:sticky;
    top:0;

    display:flex;
    justify-content:center;
    gap:15px;

    padding:16px;

    background:white;

    border-bottom:1px solid #e4e7ec;

    box-shadow:
    0 2px 10px rgba(0,0,0,.05);

    z-index:100;
}

nav a{
    text-decoration:none;

    color:#344054;

    font-weight:600;

    padding:10px 18px;

    border-radius:10px;

    transition:.2s;
}

nav a:hover{
    background:#eaf4ff;
    color:#0084ff;
}

.button_pushcase,
.button_remove{

    width:100%;

    border:none;

    border-radius:10px;

    padding:12px;

    cursor:pointer;

    font-weight:600;

    color:white;

    background:
    linear-gradient(
        180deg,
        #2bb8ff,
        #0084ff
    );

    transition:.2s;
}

.button_pushcase:hover,
.button_remove:hover{
    filter:brightness(1.08);
}

/* CATÁLOGO */

.catalog_grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:24px;
}

/* CARD */

.card_game{

    background:white;

    border-radius:18px;

    overflow:hidden;

    box-shadow:
    0 4px 15px rgba(0,0,0,.08);

    transition:.25s;

    display:flex;
    flex-direction:column;
}

.card_game:hover{
    transform:translateY(-5px);

    box-shadow:
    0 12px 25px rgba(0,0,0,.12);
}

.card_game_infos{
    padding:18px;
}

.card_game_infos h1{
    font-size:1.2rem;
    margin-bottom:8px;
    color:#1d2939;
}

.card_game_infos h4{
    color:#667085;
    margin-bottom:4px;
}

.card_game img{
    width:100%;
    height:320px;
    object-fit:cover;
    display:block;
}

.card_game_actions{
    padding:18px;
    margin-top:auto;
}

/* LISTA DO CARRINHO */

.card_game_list{
    display:flex;
    align-items:center;
    gap:20px;

    background:white;

    padding:20px;

    border-radius:16px;

    box-shadow:
    0 4px 12px rgba(0,0,0,.08);
}

.card_game_list img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:12px;
}
    </style>
</head>

        const user_cart = JSON.parse(sessionStorage.getItem("user_cart")) || [];

        const card_game = (game) => `
        <div class="card_game" id="${game.id}">
            <div class="card_game_infos">
                <h1>${game.titulo}</h1>
                <h4><b>Gênero:</b> ${game.genero}</h4>
                <h4><b>Preço:</b> R$ ${game.preco}</h4>
                <img src="${game.img_src}" height=300px>
            </div>

            <div class="card_game_actions">
                <button class="button_pushcase">
                    Adicionar
                </button>
            </div>
        </div>
        `;

        const card_game_list = (game) => `
        <div class="card_game_list" id="${game.id}">
            <div class="card_game_list_infos">
                <img src="${game.img_src}" height=300px>
                <h2>${game.titulo}</h2>
                <h3>R$ ${game.preco}</h3>
            </div>

            <div class="card_game_list_actions">
                <button class="button_remove">
                    Remover
                </button>
            </div>
        </div>
        `;

        // Global functions
        function randomize_array(arr)
        {
            let curr_i = arr.length;
            let rand_i, t;
            while(curr_i > 0){
                rand_i = Math.floor(Math.random() * curr_i);
                curr_i--;

                t = arr[rand_i];
                arr[rand_i] = arr[curr_i];
                arr[curr_i] = t;
            }
        }

        // HTML functions
        function home_html()
        {
            return "Bem-vindo à Loja SPO, aquela que você pode olhar, mas não pode tocar!";
        }

        function catalog_html()
        {
            let games_html = [];
            for(const i of bancoDeJogos){
                games_html.push(card_game(i));
            }
            randomize_array(games_html);

            let innerHTML = "";
            for(const i of games_html){
                innerHTML += i + "<br>";
            }
            return innerHTML;
        }

        function cart_html()
        {
            let innerHTML = "";
            let game;
            let tot = 0;
            for(const i of user_cart){
                for(const j of bancoDeJogos){
                    if(j.id != i)
                        continue;

                    game = j;
                    break;
                }
                innerHTML += card_game_list(game) + "<hr>";
                tot += parseInt(game.preco);
            }
            return innerHTML + "<hr><br><hr>" + "Total: " + tot;
        }

        function ERROR404_html()
        {
            return "<div class=\"erro_404\"> <h1>ERRO 404</h1> </div>";
        }


        // Render functions
        const container = document.getElementById('conteudo');
        function render_home()
        {
            container.innerHTML = home_html();
        }

        function render_catalog()
        {
            container.innerHTML = catalog_html();
            const button_pushcase = document.querySelectorAll(".button_pushcase");
            for(const i of button_pushcase){
                i.addEventListener('click', (e) => {
                    const game_id = parseInt(e.target.parentElement.parentElement.id);
                    if(!user_cart.includes(game_id)){
                        user_cart.push(parseInt(game_id));
                        e.target.innerHTML = "Remover";
                        const jogo = bancoDeJogos.find(
                            g => g.id === game_id
                        );
                        mostrarPopupCarrinho(jogo.titulo);

                    }
                    else {
                        user_cart.splice(user_cart.indexOf(game_id), 1);
                        e.target.innerHTML = "Adicionar";
                    }
                    sessionStorage.setItem("user_cart", JSON.stringify(user_cart));
                });

                const game_id = parseInt(i.parentElement.parentElement.id);
                if(user_cart.includes(game_id)){
                    i.innerHTML = "Remover";
                }
                else{
                    i.innerHTML = "Adicionar";
                }
            }
        }

        function render_cart()
        {
            container.innerHTML = cart_html();
            const button_remove = document.querySelectorAll(".button_remove");
            for(const i of button_remove){
                i.addEventListener('click', (e) => {
                    const game_id = parseInt(e.target.parentElement.parentElement.id);
                    user_cart.splice(user_cart.indexOf(game_id), 1);
                    render_cart();
                    sessionStorage.setItem("user_cart", JSON.stringify(user_cart));
                });
            }
        }

        function render_unknow_hash()
        {
            container.innerHTML = ERROR404_html();
        }

        function render_by_hash()
        {
            switch(window.location.hash){
                case "#home":
                    return render_home();
                    break;

                case "#catalogo":
                    return render_catalog();
                    break;

                case "#carrinho":
                    return render_cart();
                    break;

                default:
                    return render_unknow_hash();
                    break;
            }
        }



        window.addEventListener('hashchange', (e) => {
            render_by_hash();
        });
        render_by_hash();
